{% set name = "tobler" %}
{% set version = "0.14.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 9d199bee5f14fed64ef392700e15ea72dfb68543f2293b505071ee6d2f62efe9

build:
  number: 0
  skip: true  # [py<312]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv

requirements:
  host:
    - python
    - pip
    - setuptools >=61.0
    - setuptools_scm >=6.2
    # setuptools_scm[toml]
    - toml
    - wheel
  run:
    - python
    - geopandas >=1.0
    - joblib >=1.4
    - libpysal >=4.10
    - numpy >=2.0
    - pandas >=2.2
    - rasterio >=1.4
    - rasterstats >=0.20
    - scipy >=1.13
    - statsmodels >=0.14
    - tqdm >=4.67

{% set test_skip = "" %}
# require dask_geopandas
{% set test_skip = test_skip + " --ignore=tobler/tests/test_area_interpolators.py" %}
# require h3
{% set test_skip = test_skip + " --ignore=tobler/tests/test_utils.py" %}
# require astropy
{% set test_skip = test_skip + " --ignore=tobler/tests/test_pycno.py" %}

# too long execution
{% set test_skip = test_skip + " --deselect=tobler/tests/test_dasymetric.py::test_masked_area_interpolate" %}
{% set test_skip = test_skip + " --deselect=tobler/tests/test_model.py::test_glm_poisson" %}

test:
  source_files:
    - tobler/tests
  requires:
    - pip
    - pytest
    # bypass a test-only issue introduced with pandas versions >=3.0
    # E       AssertionError: assert <StringDtype(storage='python', na_value=nan)> == object
    - pandas <3.0
  imports:
    - tobler
    - tobler.area_weighted
    - tobler.area_weighted.area_interpolate
    - tobler.dasymetric
    - tobler.model
    - tobler.pycno
    - tobler.util
    - tobler.util.util
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -vv {{ test_skip }} tobler/tests

about:
  home: https://github.com/pysal/tobler
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Tobler is a python package for areal interpolation, dasymetric mapping, and change of support.
  description: Tobler is a python package for areal interpolation, dasymetric mapping, and change of support.
  doc_url: https://pysal.org/tobler
  dev_url: https://github.com/pysal/tobler

extra:
  recipe-maintainers:
    - knaaptime
    - sjsrey
